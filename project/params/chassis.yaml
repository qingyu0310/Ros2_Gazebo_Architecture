# 底盘参数：chassis（平衡环）+ 两个电机。要调车的手感，改这里，不用改代码。
#
# 分四段，段名就是"给哪个节点"：
#   /chassis                   平衡环自己的：模型参数、LQR 权重、限幅、遥控接口
#   /**                        两个电机共用的（通配段，改一处两轮齐变）
#   /motor_left、/motor_right  只有 max_effort 这一个键要单开段，原因写在那段上面
#
# 谁读它：
#   chassis 节点 —— sim.launch.py 里直接带上（parameters）。两个电机是同一个进程里的子节点，
#                走的就是下面那个 /** 段（它们的 NodeOptions 没关 use_global_arguments）
#   键盘遥控不在这个文件里：它在自己的终端里单独跑（ros2 run project keyboard），参数用代码
#   默认值（ros2_layer/node/keyboard/keyboard.hpp）。要临时改就写在命令行上：
#     ros2 run project keyboard --ros-args -p linear_speed_mps:=0.3
#
# 改完要不要编译：launch 是现读文件，但读的是 install 空间里那份拷贝。
#   改源码这份之后要 colcon build --packages-select project 才会同步到 install。
#
# 数值一律写小数点（1.0 不能写 1）：rclcpp 按 YAML 的类型给参数，写整数会和 double 类型
# 对不上，节点一启动就抛异常。
#
# 这里故意不写的东西：
#   关节名 / 指令话题 / 力矩话题 —— 那是"这台车怎么接线"，由 chassis 节点统一覆盖给两个电机
#                                    （见 chassis.hpp），不是手调的量
#   轮子半径之外的模型尺寸 —— 那些在 robot/models/ 里，跟底盘参数不是一伙的
#   传感器 / 世界 —— 同上，在 gazebo 层的 xacro 和世界里

/chassis:
  ros__parameters:
    # ---- 模型参数：由 URDF 量出来（docs/轮腿机器人LQR平衡教程.md §1.3 那段脚本），
    #      改模型就要重算 —— 这些数对不上不报错，只是站不住 ----
    wheel_radius: 0.04             # r，跟 modules/wheel.xacro 的 radius 对齐
    cart_mass: 0.6375              # M = 2*(轮子质量 + 轮子绕轴惯量/r²)
    body_mass: 1.25                # m = 总质量 1.55 - 两轮 0.30
    body_com_height: 0.06825       # l = 车身质心到轮轴的距离
    body_pitch_inertia: 0.002591   # I = 车身绕质心、绕 y 轴的俯仰惯量
    cart_damping: 0.02             # b 滚阻/粘滞阻尼，估的量，0~0.05 都行
    gravity: 9.81

    # ---- 控制：前五个进 LQR 求解，改完 K 就变了，启动时日志里会把 K 打出来对 ----
    dt: 0.001                      # 控制周期，要跟 gz 物理步长、定时器实际周期一致
    q: [500.0, 100.0, 1000.0, 550.0]   # [位移, 速度, 俯仰, 俯仰角速度] 的对角权重，四个都别给 0
    r: 10.0                         # 单轮力矩的惩罚权重，越大越柔和
    max_effort: 0.20               # LQR 公共力矩上限 N·m。得让"它 + max_differential"留在单轮附着极限 0.29 以内
    fall_angle_rad: 0.70           # |俯仰| 超过它（40°）就认定倒地，力矩归零
    pitch_sign: 1.0                # 俯仰方向反了翻成 -1.0
    control_sign: 1.0              # 力矩方向反了翻成 -1.0

    # ---- 遥控接口：键盘（ros2 run project keyboard）往 cmd_vel_topic 发 Twist ----
    cmd_vel_topic: /chassis/cmd_vel
    max_velocity: 1.00             # 前后速度上限 m/s
    linear_sign: -1.0              # 键盘按前进、车却往后跑时翻成 -1.0（只翻目标值，平衡环不动）
    max_yaw_rate: 1.0              # 偏航角速度上限 rad/s
    yaw_kp: 0.08                   # 偏航角速度误差 -> 左右轮力矩差，N·m·s/rad。要够到 max_differential
    max_differential: 0.08         # 力矩差上限 N·m。撬动侧向摩擦起码要 0.029（见下面那段注释）
    yaw_sign: 1.0                  # 转向方向反了翻成 -1.0
    command_timeout_s: 0.30        # 这么久没收到 cmd_vel 就当停车，断了不会一直冲
    # 转向这三个数（yaw_kp / max_differential / max_effort）是一组的，别单改一个：
    #   差速给的偏航力矩 = d·t/r，侧向摩擦顶住的 = mu_lateral·N_total·t/2，
    #   一比**轮距约掉**：可用/需要 = 2d/(mu_lateral·N_total·r) —— 加宽轮距、加大 max_effort 都没用。
    #   按本车的数（t 0.044、1.49 kg、r 0.04、mu_lateral 0.1）门槛是
    #     d > mu_lateral·N_total·r/2 ≈ 0.029 N·m
    #   四轮那台用 0.02 够，是因为两个轴、力矩翻倍；两轮正好砍一半，所以这里得给到 0.08。
    #   yaw_kp 要能在满误差（max_yaw_rate）附近够到 max_differential，0.08 对应 1.0 rad/s
    #   而 max_effort 得让开：max_effort + max_differential ≤ mu_rolling·(总重/2)·r ≈ 0.29，
    #   超了那一侧轮子会打滑

    # ---- 反馈话题与模式 ----
    imu_topic: /imu
    joint_states_topic: /joint_states
    control_mode: effort           # 必须是 effort：中间插一层速度环会和平衡环对着干

# 两个电机共用的这一段。里面只有电机节点会声明的键，别的节点拿到当没看见。
# 别往这里塞底盘也声明的键（joint_states_topic / max_effort 那种）：段名是当正则匹配的，
# /** 会连 chassis 节点一起命中，而两段都命中时**靠后的段覆盖靠前的**（按文件里的先后排，
# 没有"精确段优先"这回事）—— 写了就等于把底盘那份悄悄顶掉。
#   joint_states_topic 不写：电机的那个值由底盘覆盖进来（要跟底盘订同一路），写了也不生效
#   speed_kp / speed_ki 不写：只在 speed 模式下有用，而平衡环必须是 effort，用代码默认值
/**:
  ros__parameters:
    max_speed_radps: 60.0          # 单轮转速上限 rad/s（轮径 0.04 → 2.4 m/s）。力矩模式下只是护栏
    effort_timeout_s: 0.05         # 这么久没收到指令就把力矩清零（平衡环 1 kHz 在发，够用）

# max_effort 是唯一一个"底盘和电机都声明、含义还不一样"的键：底盘的是 LQR 公共力矩上限
# （0.25），电机的是单轮上限（5.0）。放进 /** 会把底盘那份顶成 5.0，而附着极限才 0.30 ——
# 表现是轮子空转、车瞬间躺下。所以拆成两个显式段，谁也不挨着谁
/motor_left:
  ros__parameters:
    max_effort: 5.0                # 单轮力矩上限 N·m，必须 >= 底盘的 max_effort + max_differential

/motor_right:
  ros__parameters:
    max_effort: 5.0
